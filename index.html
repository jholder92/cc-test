<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valencia 2026</title>
<meta name="description" content="Today's workout — Valencia Marathon 2026 training plan.">

<meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef0f1" media="(prefers-color-scheme: light)">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Valencia">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <span class="brand">Valencia 2026</span>
    <span class="race-countdown" id="race-countdown"></span>
  </header>

  <p class="offline-banner" id="offline-banner">Offline — showing cached plan</p>

  <!-- TODAY -->
  <main class="view" id="view-today" data-view="today">
    <div class="today-header">
      <div>
        <div class="weekday" id="today-weekday">—</div>
        <div class="date num" id="today-date">—</div>
      </div>
    </div>

    <section class="hero-card" id="today-hero">
      <div class="hero-top">
        <span class="pill" id="today-pill">—</span>
        <button class="icon-btn" id="today-note-btn" aria-label="Add note" title="Add note">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>
      <h1 class="hero-title" id="today-title">—</h1>

      <div class="hero-metrics">
        <div class="hero-km num" id="today-km">—</div>
        <div class="hero-pace num" id="today-pace"></div>
      </div>

      <div class="hero-workout num" id="today-workout" hidden></div>
      <p class="hero-note" id="today-note"></p>

      <button class="completion-mark" id="today-done-toggle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span id="today-done-label">Mark done</span>
      </button>

      <div class="note-text" id="today-note-display" hidden></div>

      <div class="note-editor" id="today-note-editor" hidden>
        <textarea id="today-note-input" placeholder="Notes on this session…" maxlength="2000"></textarea>
        <div class="note-actions">
          <button id="today-note-cancel">Cancel</button>
          <button class="primary" id="today-note-save">Save</button>
        </div>
      </div>
    </section>

    <div class="stack-section">
      <h2>Tomorrow</h2>
      <div class="mini-row" id="tomorrow-row">
        <span class="mini-label" id="tomorrow-day">—</span>
        <div class="mini-body">
          <span class="pill" id="tomorrow-pill">—</span>
          <span class="mini-title" id="tomorrow-title"></span>
          <span class="mini-pace num" id="tomorrow-pace"></span>
        </div>
        <span class="mini-km num" id="tomorrow-km"></span>
      </div>
    </div>

    <div class="stack-section">
      <h2>This week</h2>
      <div class="week-remaining">
        <span>Remaining</span>
        <span><span class="value num" id="week-remaining-km">—</span><span class="unit">km of <span id="week-total-km">—</span> km</span></span>
      </div>
    </div>
  </main>

  <!-- WEEK -->
  <main class="view" id="view-week" data-view="week" hidden>
    <div class="week-nav">
      <button class="nav-btn" id="week-prev" aria-label="Previous week">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="week-heading">
        <div class="label" id="week-label">—</div>
        <div class="block" id="week-block">—</div>
      </div>
      <button class="nav-btn" id="week-next" aria-label="Next week">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <div class="week-stats">
      <span><strong id="week-stat-km">—</strong> total</span>
      <span><strong id="week-stat-book">—</strong> book range</span>
    </div>
    <p class="week-headline" id="week-headline" hidden></p>

    <div class="week-track" id="week-track">
      <div class="day-list" id="week-days"></div>
    </div>
  </main>

  <!-- BLOCK -->
  <main class="view" id="view-block" data-view="block" hidden>
    <div class="today-header" style="margin-top:10px">
      <div class="weekday" style="font-size:18px">Full block</div>
    </div>
    <div class="block-list" id="block-list"></div>
  </main>

  <!-- REFERENCE -->
  <main class="view" id="view-reference" data-view="reference" hidden>
    <div class="today-header" style="margin-top:10px">
      <div class="weekday" style="font-size:18px">Reference</div>
    </div>

    <section class="ref-card">
      <h2>Paces</h2>
      <div id="ref-paces"></div>
    </section>

    <section class="ref-card">
      <h2>The Oxford gate</h2>
      <div id="ref-gate"></div>
    </section>

    <section class="ref-card">
      <h2>Rules</h2>
      <ol class="rules-list" id="ref-rules"></ol>
    </section>
  </main>

</div>

<nav class="tabbar" id="tabbar">
  <button data-target="today" aria-current="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    Today
  </button>
  <button data-target="week" aria-current="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Week
  </button>
  <button data-target="block" aria-current="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M11 19V4M18 19v-6"/></svg>
    Block
  </button>
  <button data-target="reference" aria-current="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
    Reference
  </button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
