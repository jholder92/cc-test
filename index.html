<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valencia 2026</title>
<meta name="description" content="Today's workout — Valencia Marathon 2026 training plan.">

<meta name="theme-color" content="#efeee7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Valencia">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand-row">
      <div class="brand display display-dots">Valencia<br>2026</div>
      <div class="race-countdown" id="race-countdown"></div>
    </div>
  </header>

  <nav class="pillnav" id="pillnav">
    <button data-target="today" aria-current="true">Today</button>
    <button data-target="week" aria-current="false">Week</button>
    <button data-target="block" aria-current="false">Block</button>
    <button data-target="reference" aria-current="false">Reference</button>
  </nav>

  <p class="offline-banner" id="offline-banner">Offline — showing cached plan</p>

  <!-- TODAY -->
  <main class="view" id="view-today" data-view="today">
    <div class="today-head">
      <div class="weekday display" id="today-weekday">—</div>
      <div class="date num" id="today-date">—</div>
    </div>
    <hr class="rule-double">

    <section class="hero" id="today-hero">
      <div class="hero-type-row">
        <span class="dot" id="today-dot"></span>
        <span class="type-label" id="today-type-label">—</span>
      </div>
      <h1 class="hero-title" id="today-title">—</h1>

      <div class="hero-stats">
        <div class="stat">
          <span class="stat-label">Distance</span>
          <span class="stat-value num" id="today-km">—</span>
        </div>
        <div class="stat pace" id="today-pace-stat" hidden>
          <span class="stat-label">Pace</span>
          <span class="stat-value num" id="today-pace">—</span>
        </div>
      </div>

      <div class="workout-box" id="today-workout-box" hidden>
        <div class="workout-row">
          <span class="workout-text num" id="today-workout">—</span>
          <button class="plus-btn" id="today-workout-toggle" aria-expanded="false" aria-label="Show workout breakdown">
            <span class="glyph">+</span>
          </button>
        </div>
        <div class="breakdown" id="today-breakdown" hidden></div>
      </div>

      <p class="hero-note" id="today-note"></p>

      <div>
        <button class="done-toggle" id="today-done-toggle">
          <span class="box" id="today-done-box"></span>
          <span id="today-done-label">Mark done</span>
        </button>
        <button class="note-btn" id="today-note-btn">Note</button>
      </div>

      <div class="note-text" id="today-note-display" hidden></div>

      <div class="note-editor" id="today-note-editor" hidden>
        <textarea id="today-note-input" placeholder="Notes on this session…" maxlength="2000"></textarea>
        <div class="note-actions">
          <button id="today-note-cancel">Cancel</button>
          <button class="primary" id="today-note-save">Save</button>
        </div>
      </div>
    </section>

    <div class="stack-section" style="border-top:1px solid var(--line-soft)">
      <h2>Tomorrow</h2>
      <div class="mini-row" id="tomorrow-row">
        <span class="mini-label" id="tomorrow-day">—</span>
        <div class="mini-body">
          <span class="dot" id="tomorrow-dot"></span>
          <span class="mini-title" id="tomorrow-title"></span>
          <span class="mini-pace num" id="tomorrow-pace"></span>
        </div>
        <span class="mini-km num" id="tomorrow-km"></span>
      </div>
    </div>

    <div class="stack-section" style="border-top:1px solid var(--line-soft)">
      <h2>This week</h2>
      <div class="week-remaining">
        <span>Remaining</span>
        <span><span class="value num" id="week-remaining-km">—</span><span class="unit">km of <span id="week-total-km">—</span> km</span></span>
      </div>
    </div>
  </main>

  <!-- WEEK -->
  <main class="view" id="view-week" data-view="week" hidden>
    <div class="week-nav">
      <button class="nav-btn" id="week-prev" aria-label="Previous week">&larr;</button>
      <div class="week-heading">
        <div class="label" id="week-label">—</div>
        <div class="block" id="week-block">—</div>
      </div>
      <button class="nav-btn" id="week-next" aria-label="Next week">&rarr;</button>
    </div>
    <div class="week-stats">
      <span><strong id="week-stat-km">—</strong> total</span>
      <span><strong id="week-stat-book">—</strong> book range</span>
    </div>
    <p class="week-headline" id="week-headline" hidden></p>

    <div class="col-headers">
      <span>Day</span>
      <span>Session</span>
      <span>Km</span>
      <span></span>
    </div>
    <div class="week-track" id="week-track">
      <div class="day-list" id="week-days"></div>
    </div>
  </main>

  <!-- BLOCK -->
  <main class="view" id="view-block" data-view="block" hidden>
    <div class="today-head" style="margin-top:6px">
      <div class="weekday display" style="font-size:26px">Full block</div>
    </div>
    <hr class="rule-double">
    <div class="block-list" id="block-list"></div>
  </main>

  <!-- REFERENCE -->
  <main class="view" id="view-reference" data-view="reference" hidden>
    <div class="today-head" style="margin-top:6px">
      <div class="weekday display" style="font-size:26px">Reference</div>
    </div>
    <hr class="rule-double">

    <section class="ref-section">
      <h2>Paces</h2>
      <div id="ref-paces"></div>
    </section>

    <section class="ref-section">
      <h2>The Oxford gate</h2>
      <div id="ref-gate"></div>
    </section>

    <section class="ref-section">
      <h2>Rules</h2>
      <ol class="rules-list" id="ref-rules"></ol>
    </section>
  </main>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
